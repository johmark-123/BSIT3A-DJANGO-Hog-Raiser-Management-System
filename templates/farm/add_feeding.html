{% extends "theme/base.html" %}
{% block content %}
<div class="container-xl mt-4">
    <h2>{{ title }}</h2>
    <div class="card col-md-8">
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}

                {{ form.as_p }}

                <button type="submit" class="btn btn-primary mt-3">I-save at I-update ang Stock</button>
                <a href="{% url 'farm:feed_deduction_list' %}" class="btn btn-secondary mt-3">Lumabas sa Listahan</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}{% endblock %}
